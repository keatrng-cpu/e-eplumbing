# North Fork Plumbing Co. — static marketing site
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/book.html"
  to = "/services.html"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/book"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/get-a-price"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/plan"
  to = "/plans.html"
  status = 301

[[redirects]]
  from = "/plans"
  to = "/plans.html"
  status = 301

[[redirects]]
  from = "/home-team-plan"
  to = "/plans.html"
  status = 301

[[redirects]]
  from = "/reviews"
  to = "/reviews.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/about.html#contact"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/about.html#faq"
  status = 301

[[redirects]]
  from = "/service-area"
  to = "/about.html#area"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=(self)"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
